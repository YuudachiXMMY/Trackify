version: 1

# Each entry tracks a Figma Make file that we have diverged from.
# - `path`: the file as Figma Make ships it (inside apps/web/)
# - `override`: where our version lives (if path == override, it's a "self-fork" — we edit in place)
# - `upstream.hash`: sha256 of the last-known upstream version, used to detect drift on sync
# - `upstream.snapshot`: frozen copy of the upstream file for diffing
#
# On `pnpm figma:sync`, the check-forks script compares each `path` against
# `upstream.hash`. If it differs, Figma Make shipped a new upstream version
# and you must manually port the changes into `override`.

forks:
  - path: apps/web/src/app/components/AuthContext.tsx
    override: apps/web-overrides/src/components/AuthContext.tsx
    reason: >
      Replaced Figma Make's stub context with a real JWT auth flow:
      register, login, logout, and /api/auth/me token refresh.
    upstream:
      hash: 9009801bd6b3f35c16ce58c760f7ccd7a086955bd5a1cf6b94555444e0627b09
      snapshot: apps/web-overrides/.snapshots/AuthContext.tsx

  - path: apps/web/src/app/components/Root.tsx
    override: apps/web-overrides/src/components/Root.tsx
    reason: >
      Wraps the entire app with AuthProvider and adds authenticated route
      guards so unauthenticated users are redirected to LoginScreen.
    upstream:
      hash: 91618e698d3e28014b7a19ebe4ade049409a7ce09d15f310f3a7592b33de6aef
      snapshot: apps/web-overrides/.snapshots/Root.tsx

  - path: apps/web/src/app/components/LoginScreen.tsx
    override: apps/web-overrides/src/components/LoginScreen.tsx
    reason: >
      Wired login form to POST /api/auth/login and stores the returned JWT
      via AuthContext; handles validation errors and loading state.
    upstream:
      hash: 542d915e93cd56cd6030ec34b4c9b687a578ac36ad23d6c6f2515af55dd005ad
      snapshot: apps/web-overrides/.snapshots/LoginScreen.tsx

